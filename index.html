<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MY LIFE 蔵書録 PWA試作 v0.1</title>
<style>
:root{
  --bg:#f3f4f6;--panel:#fff;--line:#d7dbe0;--text:#1f2937;--muted:#6b7280;
  --accent:#2563eb;--accent-soft:#e8f0ff;--accent-soft-2:#f3f7ff;--chip:#eef2f7;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif}
button,input{font:inherit}button{touch-action:manipulation}
.app{width:min(100%,520px);margin:0 auto;min-height:100vh;padding-bottom:80px}
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line);padding:12px 14px 10px}
.title-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{font-size:18px;margin:0}.badge{font-size:11px;color:var(--muted)}
.mode-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.mode-btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 8px;font-weight:700}
.mode-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.perfbar{margin-top:8px;font-size:11px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.perfbar b{color:var(--text)}
.section{margin:10px 10px 0;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.section-head{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid #eceff3;gap:10px}
.section-head h2{font-size:15px;margin:0}.hint{font-size:11px;color:var(--muted);white-space:nowrap}
.recent-strip{display:flex;gap:8px;overflow-x:auto;padding:10px;scrollbar-width:none}.recent-strip::-webkit-scrollbar{display:none}
.recent-card{min-width:126px;max-width:126px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px;text-align:left}
.recent-card .t{font-weight:700;font-size:13px;line-height:1.35}.recent-card .s{font-size:11px;color:var(--muted);margin-top:5px}
.nav-wrap{padding:12px}.kana-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.kana-btn{min-height:48px;border:1px solid var(--line);background:#fff;border-radius:11px;font-size:18px;font-weight:800;padding:0 4px}
.kana-btn.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.sub-kana-panel{margin-top:10px;border:2px solid #b8cdfc;border-radius:14px;background:var(--accent-soft-2);padding:10px}
.sub-kana-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.sub-kana-title{font-size:12px;font-weight:800;color:var(--accent)}.sub-kana-guide{font-size:11px;color:var(--muted)}
.sub-kana{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.sub-kana .kana-btn{width:100%;min-width:0}
.latin-rows{display:flex;flex-direction:column;gap:8px}
.latin-row{display:grid;gap:8px}
.latin-row.five{grid-template-columns:repeat(5,minmax(0,1fr))}
.latin-row.six{grid-template-columns:repeat(6,minmax(0,1fr))}
.latin-row .kana-btn{width:100%;min-width:0;padding:0;font-size:17px}

.path{margin-top:10px;padding:8px 10px;border-radius:9px;background:#f7f8fa;font-size:13px;line-height:1.45}.path b{color:var(--accent)}
.fav-block{margin-top:10px}.fav-label{font-size:11px;font-weight:800;color:var(--muted);margin-bottom:6px}
.fav-row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.fav-row::-webkit-scrollbar{display:none}
.fav-chip{white-space:nowrap;border:1px solid #b9c4d2;background:var(--chip);border-radius:999px;padding:7px 11px;font-weight:800;font-size:12px}
.author-head{display:flex;justify-content:space-between;align-items:end;margin-top:12px;padding-bottom:6px;border-bottom:1px solid #eceff3;gap:10px}
.author-head strong{font-size:13px}.author-head span{font-size:11px;color:var(--muted);white-space:nowrap}
.author-row{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;border:0;border-bottom:1px solid #edf0f3;background:#fff;padding:9px 2px;text-align:left;min-height:38px}
.author-row:last-child{border-bottom:0}.author-name{font-weight:800;font-size:13px}.count{font-size:11px;color:var(--muted);white-space:nowrap}
.work-row{width:100%;border:0;border-bottom:1px solid #eceff3;background:#fff;padding:12px;text-align:left}.work-row:last-child{border-bottom:0}
.work-title{font-weight:800}.work-meta{font-size:11px;color:var(--muted);margin-top:4px}.score{font-weight:800;margin-left:8px}
.back-btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 10px;font-size:12px;font-weight:700}
.searchbox{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff}
.search-result{margin-top:8px}.empty{padding:18px 2px;color:var(--muted);font-size:12px}
.more{width:calc(100% - 24px);margin:10px 12px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px;font-weight:800}
.hidden{display:none!important}
details.test{margin:10px 10px 0;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 11px;font-size:12px}
details.test summary{font-weight:800;cursor:pointer}
.test-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}
.test-grid button,.file-label{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px;font-weight:700;text-align:center}
.test-note{color:var(--muted);font-size:11px;line-height:1.5;margin-top:8px}
.detail{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,520px);z-index:50;background:#fff;border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(0,0,0,.12);padding:12px 14px calc(12px + env(safe-area-inset-bottom));display:none}
.detail.show{display:block}.detail-top{display:flex;justify-content:space-between;gap:10px}.detail-title{font-weight:900;font-size:16px;line-height:1.35}
.detail-meta{font-size:12px;color:var(--muted);margin-top:7px;line-height:1.6}.close{border:0;background:#eef0f3;border-radius:50%;width:32px;height:32px;font-weight:900;flex:0 0 auto}
.detail-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.primary,.secondary{border-radius:10px;padding:11px 8px;font-weight:800}
.primary{border:1px solid var(--accent);background:var(--accent);color:#fff}.secondary{border:1px solid var(--line);background:#fff}




.creator-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.creator-head h2{margin:0;white-space:nowrap}
.type-switch{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:4px;
  min-width:172px;
}
.type-btn{
  border:1px solid var(--line);
  background:#fff;
  border-radius:9px;
  height:34px;
  padding:0 8px;
  font-size:13px;
  font-weight:700;
  color:var(--text);
}
.type-btn.active{
  background:var(--accent);
  color:#fff;
  border-color:var(--accent);
}

</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2563eb">
<meta name="mobile-web-app-capable" content="yes">

</head>
<body>
<div class="app">
<header class="topbar">
  <div class="title-row"><h1>MY LIFE 蔵書録</h1><span class="badge">ナビ試作 v0.63</span></div>
  <div class="mode-tabs">
    <button id="tabKana" class="mode-btn active">五十音で探す</button>
    <button id="tabPurchase" class="mode-btn">購入順</button>
  </div>
  <div id="perfBar" class="perfbar"><span>データ <b>読込中</b></span></div>
</header>

<details class="test">
  <summary>検証メニュー（普段は閉じてOK）</summary>
  <div class="test-grid">
    <button id="test100">100件で試す</button>
    <button id="test2000">2000件で試す</button>
    <label class="file-label">CSVを読み込む<input id="csvFile" type="file" accept=".csv,text/csv" hidden></label>
    <button id="restoreBuiltIn">内蔵2000件へ戻す</button>
  </div>
  <div id="testNote" class="test-note">初期状態は2000件の模擬蔵書＋英語・数字サークルのデモです。上部の「かな／英語／数字」で文字種を切り替えます。</div>
</details>

<section class="section">
  <div class="section-head"><h2>最近の5作品</h2><span class="hint">購入日の新しい順</span></div>
  <div id="recentStrip" class="recent-strip"></div>
</section>

<section id="kanaSection" class="section">
  <div class="section-head creator-head">
      <h2>サークルを探す</h2>
      <div class="type-switch" aria-label="文字種切替">
        <button class="type-btn active" id="typeKana">かな</button>
        <button class="type-btn" id="typeLatin">英語</button>
        <button class="type-btn" id="typeNumber">数字</button>
      </div>
    </div>
  <div class="nav-wrap">
    <div id="rowGrid" class="kana-grid"></div>
    <div id="subKanaPanel" class="sub-kana-panel hidden">
      <div class="sub-kana-head"><span id="subKanaTitle" class="sub-kana-title"></span><span class="sub-kana-guide">次の文字を選択</span></div>
      <div id="subKana" class="sub-kana"></div>
    </div>
    <div id="path" class="path">まず <b>あ・か・さ・た・な…</b> の行を選びます。</div>
    <div id="authorArea" class="hidden">
      <div class="fav-block"><div class="fav-label">よく見るサークル</div><div id="favRow" class="fav-row"></div></div>
      <div class="author-head"><strong id="authorListTitle"></strong><span id="authorCount"></span></div>
      <div id="authorList"></div>
    </div>
    <div id="workArea" class="hidden"><div id="workHeader" class="path"></div><div id="workList"></div></div>
  </div>
</section>

<section id="purchaseSection" class="section hidden">
  <div class="section-head"><h2>購入順</h2><span id="purchaseCount" class="hint"></span></div>
  <div id="purchaseList"></div>
  <button id="purchaseMore" class="more hidden">さらに表示</button>
</section>

<section class="section">
  <div class="section-head"><h2>直接検索</h2><span class="hint">サークル・作品</span></div>
  <div style="padding:10px 12px 12px">
    <input id="searchInput" class="searchbox" placeholder="例：PONDEMIX / 夏の午後">
    <div id="searchResult" class="search-result"></div>
  </div>
</section>
</div>

<div id="detail" class="detail">
  <div class="detail-top">
    <div><div id="detailTitle" class="detail-title"></div><div id="detailMeta" class="detail-meta"></div></div>
    <button id="detailClose" class="close">×</button>
  </div>
  <div class="detail-actions">
    <button id="reviewBtn" class="primary">レビューする</button>
    <button id="closeBtn2" class="secondary">閉じる</button>
  </div>
</div>

<script>
const rows={"あ":["あ","い","う","え","お"],"か":["か","き","く","け","こ"],"さ":["さ","し","す","せ","そ"],"た":["た","ち","つ","て","と"],"な":["な","に","ぬ","ね","の"],"は":["は","ひ","ふ","へ","ほ"],"ま":["ま","み","む","め","も"],"や":["や","ゆ","よ"],"ら":["ら","り","る","れ","ろ"],"わ":["わ"]};
const allKana=Object.values(rows).flat();
const latinLetters="ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
const latinRows=[latinLetters.slice(0,5),latinLetters.slice(5,10),latinLetters.slice(10,15),latinLetters.slice(15,20),latinLetters.slice(20,26)];
const kataToHira=s=>(s||"").replace(/[\u30a1-\u30f6]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
const norm=s=>kataToHira(String(s||"").trim()).toLowerCase();

let builtIn, works=[], authors=[], worksByAuthor=new Map(), authorsByKana=new Map(), activeLimit=2000;
let purchaseShown=0, lastPerf="";

function initialLoad(){
  const t0=performance.now();
  builtIn=JSON.parse(document.getElementById("builtInData").textContent);
  const demoCreators=[
    ["D9001","PONDEMIX","PONDEMIX"],["D9002","Blue Archive Lab","Blue Archive Lab"],
    ["D9003","FROG WORKS","FROG WORKS"],["D9004","K-MOTION","K-MOTION"],
    ["D9005","Moonlight Studio","Moonlight Studio"],["D9006","SWEET TASTE","SWEET TASTE"],
    ["D9007","UVW Factory","UVW Factory"],["D9008","XYZ CLUB","XYZ CLUB"],
    ["D9009","7th Heaven","7th Heaven"],["D9010","404 Studio","404 Studio"]
  ];
  for(let i=0;i<demoCreators.length;i++){
    const [id,name,kana]=demoCreators[i];
    builtIn.authors.push({author_id:id,author:name,author_kana:kana,click_count:40-i});
    builtIn.works.push({
      work_id:`demo_${i+1}`,fanza_id:`demo_${i+1}`,title:`${name} のデモ作品`,
      author:name,author_kana:kana,circle:name,purchase_date:`2026-09-${String(i+1).padStart(2,"0")}`,
      score:"未読",product_url:"#"
    });
  }
  const t1=performance.now();
  loadData(builtIn.works, builtIn.authors, `内蔵2000件`, t1-t0);
}

function loadData(newWorks,newAuthors,label,parseMs=0){
  const t0=performance.now();
  works=newWorks.slice();
  authors=(newAuthors && newAuthors.length?newAuthors:deriveAuthors(works)).slice();
  buildIndexes();
  const t1=performance.now();
  renderRecent();
  renderPurchaseReset();
  clearNavigator();
  const t2=performance.now();
  setPerf(`${label}`,parseMs,t1-t0,t2-t1);
}

function deriveAuthors(ws){
  const map=new Map();
  for(const w of ws){
    const name=w.author||"作者不明";
    if(!map.has(name)) map.set(name,{author_id:name,author:name,author_kana:w.author_kana||name,click_count:0});
  }
  return [...map.values()];
}

function buildIndexes(){
  worksByAuthor=new Map();
  for(const w of works){
    if(!worksByAuthor.has(w.author)) worksByAuthor.set(w.author,[]);
    worksByAuthor.get(w.author).push(w);
  }
  authorsByKana=new Map(allKana.map(k=>[k,[]]));
  for(const l of latinLetters) authorsByKana.set(l,[]);
  authorsByKana.set("#",[]);
  authorsByKana.set("他",[]);
  for(const a of authors){
    const display=String(a.author||"").trim();
    const dc=display.slice(0,1);
    let key="他";
    if(/[A-Za-z]/.test(dc)) key=dc.toUpperCase();
    else if(/[0-9]/.test(dc)) key="#";
    else{
      const y=norm(a.author_kana||a.author);
      const first=y.slice(0,1);
      if(authorsByKana.has(first)) key=first;
    }
    authorsByKana.get(key).push(a);
  }
  for(const arr of authorsByKana.values()) arr.sort((a,b)=>norm(a.author_kana||a.author).localeCompare(norm(b.author_kana||b.author),"ja"));
}

function setPerf(label,parseMs,indexMs,renderMs){
  document.getElementById("perfBar").innerHTML=
    `<span>データ <b>${works.length}作品</b></span><span>サークル <b>${authors.length}件</b></span>`+
    `<span>JSON <b>${parseMs.toFixed(1)}ms</b></span><span>索引 <b>${indexMs.toFixed(1)}ms</b></span>`+
    `<span>初期描画 <b>${renderMs.toFixed(1)}ms</b></span>`;
  document.getElementById("testNote").textContent=`${label}を使用中。最終操作時間は画面上部に随時表示します。`;
}
function setActionPerf(name,ms){
  lastPerf=`${name} ${ms.toFixed(1)}ms`;
  const bar=document.getElementById("perfBar");
  const old=bar.querySelector(".lastop"); if(old) old.remove();
  bar.insertAdjacentHTML("beforeend",`<span class="lastop">操作 <b>${lastPerf}</b></span>`);
}

const rowGrid=document.getElementById("rowGrid"), subKanaPanel=document.getElementById("subKanaPanel"), subKana=document.getElementById("subKana");
const subKanaTitle=document.getElementById("subKanaTitle"), path=document.getElementById("path"), authorArea=document.getElementById("authorArea");
const authorList=document.getElementById("authorList"), favRow=document.getElementById("favRow"), workArea=document.getElementById("workArea");
const workList=document.getElementById("workList"), workHeader=document.getElementById("workHeader");


function clearNavigator(){
  [...rowGrid.children].forEach(x=>x.classList.remove("active"));
  subKanaPanel.classList.add("hidden"); authorArea.classList.add("hidden"); workArea.classList.add("hidden");
  path.innerHTML='まず <b>あ・か・さ・た・な…</b> の行を選びます。';
}



const typeKanaBtn=document.getElementById("typeKana");
const typeLatinBtn=document.getElementById("typeLatin");
const typeNumberBtn=document.getElementById("typeNumber");

function setTypeActive(type){
  [typeKanaBtn,typeLatinBtn,typeNumberBtn].forEach(b=>b.classList.remove("active"));
  ({kana:typeKanaBtn,latin:typeLatinBtn,number:typeNumberBtn})[type].classList.add("active");
}
function resetBrowsePanels(){
  subKana.innerHTML="";
  subKana.style.gridTemplateColumns="";
  subKanaPanel.classList.add("hidden");
  authorArea.classList.add("hidden");
  workArea.classList.add("hidden");
}
function showKanaMode(){
  setTypeActive("kana");
  resetBrowsePanels();
  rowGrid.innerHTML="";
  rowGrid.className="kana-grid";
  for(const r of Object.keys(rows)){
    const b=document.createElement("button");
    b.className="kana-btn"; b.textContent=r;
    b.onclick=()=>selectRow(r,b);
    rowGrid.appendChild(b);
  }
  path.innerHTML='まず <b>あ・か・さ・た・な…</b> の行を選びます。';
}
function showLatinMode(){
  setTypeActive("latin");
  resetBrowsePanels();
  rowGrid.innerHTML="";
  rowGrid.className="latin-rows";
  const groups=[["A","D"],["E","H"],["I","L"],["M","P"],["Q","T"],["U","Z"]];
  const row=document.createElement("div");
  row.className="latin-row six";
  groups.forEach(([a,b])=>{
    const btn=document.createElement("button");
    btn.className="kana-btn"; btn.textContent=`${a}–${b}`;
    btn.onclick=()=>showLatinLetters(a,b,btn);
    row.appendChild(btn);
  });
  rowGrid.appendChild(row);
  path.innerHTML='英語サークルの <b>頭文字範囲</b> を選びます。';
}
function showLatinLetters(a,b,btn){
  rowGrid.querySelectorAll(".kana-btn").forEach(x=>x.classList.remove("active"));
  btn.classList.add("active");
  subKana.innerHTML="";
  subKana.className="sub-kana";
  const letters=[];
  for(let c=a.charCodeAt(0);c<=b.charCodeAt(0);c++) letters.push(String.fromCharCode(c));
  subKana.style.gridTemplateColumns=`repeat(${letters.length},minmax(0,1fr))`;
  letters.forEach(k=>{
    const b2=document.createElement("button");
    b2.className="kana-btn"; b2.textContent=k;
    b2.onclick=()=>selectKana("英語",k,b2);
    subKana.appendChild(b2);
  });
  subKanaTitle.textContent=`${a}–${b}`;
  subKanaPanel.classList.remove("hidden");
  path.innerHTML=`<b>英語 → ${a}–${b}</b>`;
}
function showNumberMode(){
  setTypeActive("number");
  resetBrowsePanels();
  rowGrid.innerHTML="";
  rowGrid.className="kana-grid";
  path.innerHTML='<b>数字</b> で始まるサークル';
  renderAuthors("#","数字");
}
typeKanaBtn.onclick=showKanaMode;
typeLatinBtn.onclick=showLatinMode;
typeNumberBtn.onclick=showNumberMode;

showKanaMode();

function selectRow(r,btn){
  [...rowGrid.children].forEach(x=>x.classList.remove("active"));btn.classList.add("active");
  subKana.innerHTML="";
  authorArea.classList.add("hidden");workArea.classList.add("hidden");

  if(r==="数字"){
    subKanaPanel.classList.add("hidden");
    path.innerHTML=`<b>数字</b>`;
    renderAuthors("#","数字");
    return;
  }

  if(r==="英語"){
    subKana.className="latin-rows";
    latinRows.forEach((letters,idx)=>{
      const row=document.createElement("div");
      row.className=`latin-row ${idx===latinRows.length-1?"six":"five"}`;
      for(const k of letters){
        const b=document.createElement("button");
        b.className="kana-btn"; b.textContent=k;
        b.onclick=()=>selectKana("英語",k,b);
        row.appendChild(b);
      }
      subKana.appendChild(row);
    });
    subKanaTitle.textContent="英語";
    subKanaPanel.classList.remove("hidden");
    path.innerHTML=`<b>英語</b> を選択。A～Zから頭文字を選びます。`;
    return;
  }

  subKana.className="sub-kana";
  for(const k of rows[r]){
    const b=document.createElement("button");b.className="kana-btn";b.textContent=k;b.onclick=()=>selectKana(r,k,b);subKana.appendChild(b);
  }
  subKanaTitle.textContent=`${r}行`;subKanaPanel.classList.remove("hidden");
  path.innerHTML=`<b>${r}行</b> を選択。次の文字を選びます。`;
}
function selectKana(r,k,btn){
  const t0=performance.now();
  subKana.querySelectorAll(".kana-btn").forEach(x=>x.classList.remove("active"));btn.classList.add("active");
  path.innerHTML=r==="英語"?`<b>英語 → ${k}</b>`:`<b>${r}行 → ${k}</b>`;workArea.classList.add("hidden");renderAuthors(k,r==="英語"?k:k);
  setActionPerf(`${k}サークル表示`,performance.now()-t0);
}
function renderAuthors(k,label=k){
  const arr=authorsByKana.get(k)||[];
  authorArea.classList.remove("hidden");
  document.getElementById("authorListTitle").textContent=`${label} のサークル一覧`;
  document.getElementById("authorCount").textContent=`${arr.length}件`;
  favRow.innerHTML="";
  [...arr].sort((a,b)=>(b.click_count||0)-(a.click_count||0)).slice(0,4).forEach(a=>{
    const b=document.createElement("button");b.className="fav-chip";b.textContent=a.author;b.onclick=()=>showWorks(a);favRow.appendChild(b);
  });
  authorList.innerHTML="";
  if(!arr.length){authorList.innerHTML='<div class="empty">該当するサークルはありません。</div>';return;}
  const frag=document.createDocumentFragment();
  for(const a of arr){
    const b=document.createElement("button");b.className="author-row";
    const cnt=(worksByAuthor.get(a.author)||[]).length;
    b.innerHTML=`<span class="author-name">${escapeHtml(a.author)}</span><span class="count">${cnt}作品 ›</span>`;
    b.onclick=()=>showWorks(a);frag.appendChild(b);
  }
  authorList.appendChild(frag);
}
function showWorks(author){
  const t0=performance.now();
  authorArea.classList.add("hidden");workArea.classList.remove("hidden");
  workHeader.innerHTML=`<button id="backAuthors" class="back-btn">← サークル一覧</button>　<b>${escapeHtml(author.author)}</b>`;
  workList.innerHTML="";
  const ws=(worksByAuthor.get(author.author)||[]).slice().sort((a,b)=>(b.purchase_date||"").localeCompare(a.purchase_date||""));
  const frag=document.createDocumentFragment();
  for(const w of ws){
    const b=document.createElement("button");b.className="work-row";
    b.innerHTML=`<div class="work-title">${escapeHtml(w.title)}<span class="score">${escapeHtml(w.score||"")}</span></div><div class="work-meta">${escapeHtml(w.purchase_date||"")}　ID: ${escapeHtml(w.work_id||"")}</div>`;
    b.onclick=()=>openDetail(w);frag.appendChild(b);
  }
  workList.appendChild(frag);
  document.getElementById("backAuthors").onclick=()=>{workArea.classList.add("hidden");authorArea.classList.remove("hidden");};
  setActionPerf(`作品${ws.length}件表示`,performance.now()-t0);
}
function renderRecent(){
  const t0=performance.now(), el=document.getElementById("recentStrip");el.innerHTML="";
  const list=works.slice().sort((a,b)=>(b.purchase_date||"").localeCompare(a.purchase_date||"")).slice(0,5);
  for(const w of list){
    const b=document.createElement("button");b.className="recent-card";
    b.innerHTML=`<div class="t">${escapeHtml(w.title)}</div><div class="s">${escapeHtml(w.author)}<br>評価 ${escapeHtml(w.score||"")}</div>`;
    b.onclick=()=>openDetail(w);el.appendChild(b);
  }
  return performance.now()-t0;
}

function renderPurchaseReset(){purchaseShown=0;document.getElementById("purchaseList").innerHTML="";renderPurchaseMore();}
function renderPurchaseMore(){
  const t0=performance.now();
  const sorted=works.slice().sort((a,b)=>(b.purchase_date||"").localeCompare(a.purchase_date||""));
  const next=sorted.slice(purchaseShown,purchaseShown+60), el=document.getElementById("purchaseList"), frag=document.createDocumentFragment();
  for(const w of next){
    const b=document.createElement("button");b.className="work-row";
    b.innerHTML=`<div class="work-title">${escapeHtml(w.title)}<span class="score">${escapeHtml(w.score||"")}</span></div><div class="work-meta">${escapeHtml(w.author)}　${escapeHtml(w.purchase_date||"")}</div>`;
    b.onclick=()=>openDetail(w);frag.appendChild(b);
  }
  el.appendChild(frag);purchaseShown+=next.length;
  document.getElementById("purchaseCount").textContent=`${works.length}作品`;
  const more=document.getElementById("purchaseMore");more.classList.toggle("hidden",purchaseShown>=sorted.length);
  setActionPerf(`購入順+${next.length}件`,performance.now()-t0);
}
document.getElementById("purchaseMore").onclick=renderPurchaseMore;

function openDetail(w){
  document.getElementById("detailTitle").textContent=w.title;
  document.getElementById("detailMeta").innerHTML=`作者：${escapeHtml(w.author)}<br>サークル：${escapeHtml(w.circle||"")}<br>作品ID：${escapeHtml(w.work_id||w.fanza_id||"")}<br>現在評価：${escapeHtml(w.score||"")}`;
  document.getElementById("reviewBtn").onclick=()=>alert(`将来ここから評価計算機へ渡します。\n\n作品ID：${w.work_id||w.fanza_id||""}\nタイトル：${w.title}`);
  document.getElementById("detail").classList.add("show");
}
function closeDetail(){document.getElementById("detail").classList.remove("show")}
document.getElementById("detailClose").onclick=closeDetail;document.getElementById("closeBtn2").onclick=closeDetail;

const tabKana=document.getElementById("tabKana"),tabPurchase=document.getElementById("tabPurchase");
tabKana.onclick=()=>{tabKana.classList.add("active");tabPurchase.classList.remove("active");document.getElementById("kanaSection").classList.remove("hidden");document.getElementById("purchaseSection").classList.add("hidden")};
tabPurchase.onclick=()=>{tabPurchase.classList.add("active");tabKana.classList.remove("active");document.getElementById("purchaseSection").classList.remove("hidden");document.getElementById("kanaSection").classList.add("hidden")};

let searchTimer;
document.getElementById("searchInput").addEventListener("input",e=>{
  clearTimeout(searchTimer);
  searchTimer=setTimeout(()=>runSearch(e.target.value),70);
});
function runSearch(raw){
  const q=norm(raw), out=document.getElementById("searchResult");out.innerHTML="";
  if(!q)return;
  const t0=performance.now(), matches=[];
  for(const w of works){
    if(norm(w.title).includes(q)||norm(w.author).includes(q)||norm(w.circle).includes(q)){matches.push(w);if(matches.length>=30)break;}
  }
  const frag=document.createDocumentFragment();
  for(const w of matches){
    const b=document.createElement("button");b.className="work-row";
    b.innerHTML=`<div class="work-title">${escapeHtml(w.title)}<span class="score">${escapeHtml(w.score||"")}</span></div><div class="work-meta">${escapeHtml(w.author)}　${escapeHtml(w.work_id||"")}</div>`;
    b.onclick=()=>openDetail(w);frag.appendChild(b);
  }
  out.appendChild(frag);
  if(!matches.length)out.innerHTML='<div class="empty">該当なし</div>';
  setActionPerf(`2000件検索`,performance.now()-t0);
}

document.getElementById("csvFile").addEventListener("change",async e=>{
  const f=e.target.files[0];if(!f)return;
  const t0=performance.now();const text=await f.text();const rows=parseCSV(text);const t1=performance.now();
  if(rows.length<2){alert("CSVにデータがありません。");return;}
  const headers=rows[0].map(x=>x.replace(/^\ufeff/,"").trim());
  const idx=(names)=>{for(const n of names){const i=headers.indexOf(n);if(i>=0)return i;}return -1;};
  const ix={
    id:idx(["work_id","ID","作品ID","MY LIFE ID"]),
    fanza:idx(["fanza_id","FANZA作品ID"]),
    title:idx(["title","タイトル"]),
    author:idx(["author","作者"]),
    kana:idx(["author_kana","作者よみ","作者読み","作者かな"]),
    circle:idx(["circle","サークル"]),
    date:idx(["purchase_date","購入日"]),
    score:idx(["score","自分評価"]),
    url:idx(["product_url","作品URL"])
  };
  if(ix.title<0||ix.author<0){alert("最低限「タイトル」と「作者」列が必要です。");return;}
  const ws=rows.slice(1).filter(r=>r.some(Boolean)).map((r,n)=>({
    work_id:ix.id>=0?r[ix.id]:(ix.fanza>=0?r[ix.fanza]:`import_${n+1}`),
    fanza_id:ix.fanza>=0?r[ix.fanza]:"",
    title:r[ix.title]||"",
    author:r[ix.author]||"作者不明",
    author_kana:ix.kana>=0?r[ix.kana]:(r[ix.author]||""),
    circle:ix.circle>=0?r[ix.circle]:"",
    purchase_date:ix.date>=0?r[ix.date]:"",
    score:ix.score>=0?r[ix.score]:"",
    product_url:ix.url>=0?r[ix.url]:""
  }));
  loadData(ws,null,`CSV ${f.name}`,t1-t0);
  e.target.value="";
});

function parseCSV(text){
  const out=[];let row=[],field="",q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c=='"'&&text[i+1]=='"'){field+='"';i++;}
      else if(c=='"')q=false; else field+=c;
    }else{
      if(c=='"')q=true;
      else if(c==','){row.push(field);field="";}
      else if(c=='\n'){row.push(field.replace(/\r$/,""));out.push(row);row=[];field="";}
      else field+=c;
    }
  }
  if(field.length||row.length){row.push(field.replace(/\r$/,""));out.push(row);}
  return out;
}
function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
